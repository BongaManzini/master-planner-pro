<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Planner Pro - Work Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    <style>
        [x-cloak] { display: none !important; }
        body { font-family: 'Space+Mono', monospace; background-color: #f8f9fa; color: #1a1a1a; }
        .brutalist-card { border: 3px solid black; box-shadow: 6px 6px 0px 0px #000; background: white; }
        .font-goal { font-family: 'Playfair Display', serif; font-style: italic; color: #6d28d9; }
        .marker-dot { width: 6px; height: 6px; border-radius: 999px; }
        .marker-bar { width: 12px; height: 3px; border-radius: 1px; }
        .marker-square { width: 8px; height: 8px; border: 1.5px solid black; }
        .timeline-slot:hover { background-color: #fef08a; cursor: pointer; }
    </style>
</head>
<body x-data="plannerApp()">

    <div class="flex min-h-screen">
        <nav class="w-20 border-r border-gray-300 bg-[#f3f3f3] flex flex-col items-center py-8 gap-10 sticky top-0 h-screen z-50">
            <div class="w-12 h-12 bg-[#0078d4] text-white flex items-center justify-center rounded-md font-black text-2xl shadow-lg">B</div>
            <button @click="activeTab = 'Calendar'" class="text-2xl hover:scale-125 transition-transform">📅</button>
            <button @click="openModal('Task')" class="text-2xl hover:scale-125 transition-transform">✅</button>
            <button @click="openModal('Goal')" class="text-2xl hover:scale-125 transition-transform">🎯</button>
            <button @click="localStorage.clear(); location.reload();" class="mt-auto text-[10px] font-black border-2 border-black p-1 hover:bg-red-500">WIPE</button>
        </nav>

        <main class="flex-1 p-6 overflow-x-hidden">
            <header class="max-w-full mx-auto mb-8 brutalist-card overflow-hidden">
                <div class="h-20 bg-gradient-to-r from-slate-900 to-slate-700 border-b-2 border-black"></div>
                <div class="p-4 bg-white flex justify-between items-center">
                    <h1 class="text-2xl font-black uppercase italic tracking-tighter" x-text="'Workspace: ' + selectedDate"></h1>
                    <div class="flex gap-4">
                        <div class="flex items-center gap-1 text-[10px] font-bold"><div class="marker-dot bg-red-500"></div> Daily</div>
                        <div class="flex items-center gap-1 text-[10px] font-bold"><div class="w-3 h-1 bg-blue-500"></div> Monthly</div>
                        <div class="flex items-center gap-1 text-[10px] font-bold"><div class="marker-square bg-purple-500"></div> Quarterly</div>
                    </div>
                </div>
            </header>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
                <div class="lg:col-span-8 space-y-6">
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                        <div class="brutalist-card p-4">
                            <div class="flex justify-between items-center mb-4">
                                <h2 class="font-black text-xs uppercase" x-text="formatMonthYear(viewDate)"></h2>
                                <div class="flex gap-1">
                                    <button @click="changeMonth(-1)" class="px-2 border border-black hover:bg-black hover:text-white">←</button>
                                    <button @click="changeMonth(1)" class="px-2 border border-black hover:bg-black hover:text-white">→</button>
                                </div>
                            </div>
                            <div class="grid grid-cols-7 gap-1 text-center text-[10px] font-black mb-2 border-b border-black pb-1">
                                <template x-for="d in ['S','M','T','W','T','F','S']"><div x-text="d"></div></template>
                            </div>
                            <div class="grid grid-cols-7 gap-1">
                                <template x-for="dateObj in calendarDays">
                                    <button @click="dateObj.date && (selectedDate = dateObj.date)"
                                        class="aspect-square flex flex-col items-center justify-center text-xs font-bold rounded-full relative transition-all"
                                        :class="{
                                            'text-gray-300': !dateObj.date,
                                            'bg-[#0078d4] text-white': selectedDate === dateObj.date,
                                            'hover:bg-gray-100': selectedDate !== dateObj.date && dateObj.date
                                        }">
                                        <span x-text="dateObj.day"></span>
                                        <div class="flex gap-0.5 absolute bottom-1">
                                            <template x-if="hasItems(dateObj.date, 'Daily')"><div class="marker-dot bg-red-500"></div></template>
                                            <template x-if="hasItems(dateObj.date, 'Monthly')"><div class="w-2 h-0.5 bg-blue-500"></div></template>
                                            <template x-if="hasItems(dateObj.date, 'Quarterly')"><div class="marker-square bg-purple-500"></div></template>
                                        </div>
                                    </button>
                                </template>
                            </div>
                        </div>

                        <div class="brutalist-card bg-red-50 p-4">
                            <h3 class="font-black uppercase text-sm mb-4 border-b-2 border-black pb-1">Urgent Priorities</h3>
                            <div class="space-y-2 overflow-y-auto max-h-[300px]">
                                <template x-for="item in getFilteredItems('URGENT')" :key="item.id">
                                    <div class="flex items-center gap-2 p-2 bg-white border border-black text-[10px] font-bold">
                                        <input type="checkbox" x-model="item.done" @change="save()">
                                        <span :class="item.type === 'Goal' ? 'font-goal' : ''" x-text="item.text"></span>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>

                    <div class="brutalist-card p-4">
                        <h3 class="font-black uppercase text-sm mb-4 bg-cyan-400 p-1 inline-block border border-black">Scheduled Importance</h3>
                        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                            <template x-for="item in getFilteredItems('IMPORTANT')" :key="item.id">
                                <div class="p-3 border-2 border-black bg-white flex justify-between items-start">
                                    <div>
                                        <p :class="item.type === 'Goal' ? 'font-goal text-lg' : 'font-bold text-xs'" x-text="item.text"></p>
                                        <span class="text-[9px] font-black bg-black text-white px-1 mt-1 inline-block" x-text="item.time"></span>
                                    </div>
                                    <input type="checkbox" x-model="item.done" @change="save()" class="w-4 h-4 border-2 border-black accent-black">
                                </div>
                            </template>
                        </div>
                    </div>
                </div>

                <div class="lg:col-span-4 brutalist-card h-fit overflow-hidden flex flex-col sticky top-6">
                    <div class="p-3 bg-white border-b-2 border-black font-black text-xs uppercase flex justify-between">
                        <span>Day Schedule</span>
                        <span x-text="selectedDate"></span>
                    </div>
                    <div class="overflow-y-auto max-h-[600px] bg-[#fafafa]">
                        <template x-for="h in 24">
                            <div class="flex border-b border-gray-100 timeline-slot" @click="openAtHour(h-1)">
                                <div class="w-12 p-2 text-[9px] font-black text-gray-400 border-r border-gray-100" x-text="(h-1).toString().padStart(2,'0')+':00'"></div>
                                <div class="flex-1 p-1 space-y-1 min-h-[40px]">
                                    <template x-for="item in getItemsByHour(h-1)">
                                        <div class="border-2 border-black p-1 text-[9px] font-black" 
                                             :class="item.type === 'Goal' ? 'bg-purple-100 font-goal italic' : 'bg-blue-100'">
                                            <span x-text="item.text"></span>
                                            <span class="float-right text-red-600" x-text="item.deadline"></span>
                                        </div>
                                    </template>
                                </div>
                            </div>
                        </template>
                    </div>
                </div>
            </div>
        </main>

        <div x-show="showModal" x-cloak class="fixed inset-0 bg-black/80 z-50 flex items-center justify-center p-4">
            <div class="brutalist-card w-full max-w-xl p-8 bg-white relative">
                <button @click="showModal = false" class="absolute -top-4 -right-4 bg-white border-4 border-black w-12 h-12 font-black text-2xl">X</button>
                <h3 class="text-3xl font-black uppercase mb-6 italic underline decoration-blue-500">Plan Entry</h3>
                
                <div class="space-y-6">
                    <div class="flex border-4 border-black">
                        <button @click="newItem.type = 'Task'" class="flex-1 p-2 font-black uppercase" :class="newItem.type === 'Task' ? 'bg-black text-white' : 'bg-white'">Task</button>
                        <button @click="newItem.type = 'Goal'" class="flex-1 p-2 font-black uppercase" :class="newItem.type === 'Goal' ? 'bg-black text-white' : 'bg-white'">Goal</button>
                    </div>

                    <input x-model="newItem.text" placeholder="Entry Title..." class="w-full border-4 border-black p-4 font-black uppercase focus:bg-yellow-50 outline-none">

                    <div class="grid grid-cols-2 gap-4">
                        <div><label class="text-xs font-black">Schedule Time</label><input type="time" x-model="newItem.time" class="w-full border-4 border-black p-2 font-black"></div>
                        <div><label class="text-xs font-black text-red-600">Deadline</label><input type="time" x-model="newItem.deadline" class="w-full border-4 border-black p-2 font-black text-red-600"></div>
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <select x-model="newItem.period" class="border-4 border-black p-2 font-black uppercase">
                            <option value="Daily">Daily</option>
                            <option value="Weekly">Weekly</option>
                            <option value="Monthly">Monthly</option>
                            <option value="Quarterly">Quarterly</option>
                        </select>
                        <select x-model="newItem.cat" class="border-4 border-black p-2 font-black uppercase">
                            <option value="URGENT">Urgent</option>
                            <option value="IMPORTANT">Important</option>
                        </select>
                    </div>

                    <button @click="addItem()" class="w-full bg-[#0078d4] text-white p-4 font-black uppercase border-4 border-black shadow-[6px_6px_0_0_#000] hover:translate-x-1 active:shadow-none transition-all">Create Work Item</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        function plannerApp() {
            return {
                todos: JSON.parse(localStorage.getItem('brutalist_final_os_v1') || '[]'),
                selectedDate: new Date().toISOString().slice(0, 10),
                viewDate: new Date(),
                showModal: false,
                newItem: { text: '', type: 'Task', period: 'Daily', time: '09:00', deadline: '', cat: 'URGENT' },

                save() { localStorage.setItem('brutalist_final_os_v1', JSON.stringify(this.todos)); },
                formatMonthYear(d) { return d.toLocaleString('default', { month: 'short', year: 'numeric' }); },
                
                get calendarDays() {
                    const year = this.viewDate.getFullYear(), month = this.viewDate.getMonth();
                    const first = new Date(year, month, 1).getDay(), last = new Date(year, month + 1, 0).getDate();
                    let days = [];
                    for (let i = 0; i < first; i++) days.push({ day: null, date: null });
                    for (let i = 1; i <= last; i++) {
                        const d = `${year}-${(month + 1).toString().padStart(2, '0')}-${i.toString().padStart(2, '0')}`;
                        days.push({ day: i, date: d });
                    }
                    return days;
                },

                changeMonth(off) { this.viewDate = new Date(this.viewDate.setMonth(this.viewDate.getMonth() + off)); },

                openAtHour(h) {
                    this.newItem.time = h.toString().padStart(2, '0') + ':00';
                    this.showModal = true;
                },

                addItem() {
                    if (!this.newItem.text) return;
                    this.todos.push({
                        id: Date.now(),
                        text: this.newItem.text,
                        type: this.newItem.type,
                        period: this.newItem.period,
                        time: this.newItem.time,
                        deadline: this.newItem.deadline,
                        category: this.newItem.cat,
                        date: this.selectedDate,
                        done: false
                    });
                    this.newItem.text = ''; this.showModal = false; this.save();
                },

                deleteItem(id) { this.todos = this.todos.filter(t => t.id !== id); this.save(); },

                getItemsByHour(h) {
                    return this.getFilteredItems('ALL').filter(t => t.time && parseInt(t.time.split(':')[0]) === h);
                },

                getFilteredItems(cat) {
                    const sel = new Date(this.selectedDate);
                    return this.todos.filter(t => {
                        const tDate = new Date(t.date);
                        if (cat !== 'ALL' && t.category !== cat) return false;
                        if (t.period === 'Daily') return t.date === this.selectedDate;
                        if (t.period === 'Weekly') {
                            const diffDays = Math.floor((sel - tDate) / (1000 * 60 * 60 * 24));
                            return diffDays >= 0 && diffDays < 7;
                        }
                        if (t.period === 'Monthly') return tDate.getMonth() === sel.getMonth() && tDate.getFullYear() === sel.getFullYear();
                        if (t.period === 'Quarterly') return Math.floor(tDate.getMonth() / 3) === Math.floor(sel.getMonth() / 3) && tDate.getFullYear() === sel.getFullYear();
                    });
                },

                hasItems(date, period) {
                    const sel = new Date(date);
                    return this.todos.some(t => {
                        const tDate = new Date(t.date);
                        if (t.period !== period) return false;
                        if (period === 'Daily') return t.date === date;
                        if (period === 'Weekly') {
                            const diff = Math.floor((sel - tDate) / (1000 * 60 * 60 * 24));
                            return diff >= 0 && diff < 7;
                        }
                        if (period === 'Monthly') return tDate.getMonth() === sel.getMonth();
                        if (period === 'Quarterly') return Math.floor(tDate.getMonth() / 3) === Math.floor(sel.getMonth() / 3);
                    });
                },

                openModal(type) { this.newItem.type = type; this.showModal = true; }
            }
        }
    </script>
</body>
</html>
